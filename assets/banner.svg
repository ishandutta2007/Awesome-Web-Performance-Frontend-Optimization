cSystemFont,&apos;Segoe UI&apos;,sans-serif;font-size:11px;font-weight:600;fill:#64748b;text-transform:uppercase;letter-spacing:.8px}.pulsing-orb-1{animation:pulseGlow 6s ease-in-out infinite;transform-origin:1000px 100px}.pulsing-orb-2{animation:pulseGlow 8s ease-in-out infinite reverse;transform-origin:150px 280px}.particle-1{animation:floatParticle 5s ease-in-out infinite}.particle-2{animation:floatParticle 7s ease-in-out infinite 1.5s}.particle-3{animation:floatParticle 6s ease-in-out infinite 3s}.stream-line{stroke-dasharray:16 12;animation:dashStream 14s linear infinite}.speed-arc{stroke-dasharray:380;animation:meterSweep 5s ease-in-out infinite}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><g opacity=".4"><circle cx="1020" cy="90" r="140" fill="#00D9F5" class="pulsing-orb-1" filter="url(#glow)"/><circle cx="120" cy="270" r="160" fill="#7B2CBF" class="pulsing-orb-2" filter="url(#glow)"/><circle cx="600" cy="340" r="110" fill="#00F5A0" class="pulsing-orb-1" filter="url(#glow)" opacity=".25"/></g><g opacity=".35"><path fill="none" stroke="#00D9F5" stroke-width="2" d="M -50 90 Q 300 20 650 140 T 1250 80" class="stream-line"/><path fill="none" stroke="#7B2CBF" stroke-width="1.5" d="M -50 140 Q 400 260 800 120 T 1250 240" class="stream-line" style="animation-duration:20s"/><path fill="none" stroke="#00F5A0" stroke-width="2" d="M -50 290 Q 350 160 850 310 T 1250 190" class="stream-line" style="animation-duration:11s"/></g><g><circle cx="950" cy="70" r="3.5" fill="#00F5A0" class="particle-1"/><circle cx="870" cy="230" r="4.5" fill="#00D9F5" class="particle-2"/><circle cx="1090" cy="190" r="3" fill="#A78BFA" class="particle-3"/><circle cx="210" cy="70" r="3" fill="#38BDF8" class="particle-1"/><circle cx="100" cy="180" r="4" fill="#34D399" class="particle-2"/></g><g transform="translate(860, 50)"><rect width="280" height="260" x="0" y="0" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(255, 25