<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Vibrant Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="50%" stop-color="#00D9F5" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>

    <!-- Speed Arc Gradient -->
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94A3B8;
      letter-spacing: 0.2px;
    }
    .badge-pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      fill: #E2E8F0;
    }
    .metric-val {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
      font-size: 18px;
      font-weight: 700;
      fill: #00F5A0;
    }
    .metric-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #64748B;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* CSS Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.06); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-18px) translateX(8px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes meterSweep {
      0%, 100% { stroke-dashoffset: 120; }
      50% { stroke-dashoffset: 40; }
    }

    .pulsing-orb-1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 1000px 100px;
    }
    .pulsing-orb-2 {
      animation: pulseGlow 8s ease-in-out infinite reverse;
      transform-origin: 150px 280px;
    }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 3s; }
    .stream-line {
      stroke-dasharray: 16 12;
      animation: dashStream 14s linear infinite;
    }
    .speed-arc {
      stroke-dasharray: 380;
      animation: meterSweep 5s ease-in-out infinite;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Dynamic Animated Ambient Lighting (Kept strictly behind foreground text) -->
  <g opacity="0.4">
    <circle class="pulsing-orb-1" cx="1020" cy="90" r="140" fill="#00D9F5" filter="url(#glow)" />
    <circle class="pulsing-orb-2" cx="120" cy="270" r="160" fill="#7B2CBF" filter="url(#glow)" />
    <circle class="pulsing-orb-1" cx="600" cy="340" r="110" fill="#00F5A0" filter="url(#glow)" opacity="0.25" />
  </g>

  <!-- Dynamic Curved Speed Data Streams -->
  <g opacity="0.35">
    <path class="stream-line" d="M -50 90 Q 300 20 650 140 T 1250 80" fill="none" stroke="#00D9F5" stroke-width="2"/>
    <path class="stream-line" d="M -50 140 Q 400 260 800 120 T 1250 240" fill="none" stroke="#7B2CBF" stroke-width="1.5" style="animation-duration: 20s;"/>
    <path class="stream-line" d="M -50 290 Q 350 160 850 310 T 1250 190" fill="none" stroke="#00F5A0" stroke-width="2" style="animation-duration: 11s;"/>
  </g>

  <!-- Floating Ambient Particles -->
  <g>
    <circle class="particle-1" cx="950" cy="70" r="3.5" fill="#00F5A0" />
    <circle class="particle-2" cx="870" cy="230" r="4.5" fill="#00D9F5" />
    <circle class="particle-3" cx="1090" cy="190" r="3" fill="#A78BFA" />
    <circle class="particle-1" cx="210" cy="70" r="3" fill="#38BDF8" />
    <circle class="particle-2" cx="100" cy="180" r="4" fill="#34D399" />
  </g>

  <!-- Right-Side Decorative Performance Gauge & Metric Cards -->
  <g transform="translate(860, 50)">
    <!-- Gauge Container Backing -->
    <rect x="0" y="0" width="280" height="260" rx="18" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
    
    <!-- Speedometer Graphic -->
    <circle cx="140" cy="100" r="65" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="10" stroke-linecap="round" />
    <circle class="speed-arc" cx="140" cy="100" r="65" fill="none" stroke="url(#arcGrad)" stroke-width="10" stroke-linecap="round" stroke-dashoffset="60" transform="rotate(-140 140 100)" />
    
    <!-- Score inside Gauge -->
    <text x="140" y="98" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff">99</text>
    <text x="140" y="118" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#00F5A0" letter-spacing="1.5">LIGHTHOUSE</text>

    <!-- 3 Core Web Vitals Micro Cards -->
    <g transform="translate(18, 175)">
      <!-- LCP Mini Card -->
      <rect x="0" y="0" width="74" height="64" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255, 255, 255, 0.06)" />
      <text x="37" y="24" text-anchor="middle" class="metric-label">LCP</text>
      <text x="37" y="48" text-anchor="middle" class="metric-val" fill="#00F5A0">0.8s</text>

      <!-- INP Mini Card -->
      <rect x="85" y="0" width="74" height="64" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255, 255, 255, 0.06)" />
      <text x="122" y="24" text-anchor="middle" class="metric-label">INP</text>
      <text x="122" y="48" text-anchor="middle" class="metric-val" fill="#38BDF8">28ms</text>

      <!-- CLS Mini Card -->
      <rect x="170" y="0" width="74" height="64" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255, 255, 255, 0.06)" />
      <text x="207" y="24" text-anchor="middle" class="metric-label">CLS</text>
      <text x="207" y="48" text-anchor="middle" class="metric-val" fill="#A78BFA">0.00</text>
    </g>
  </g>

  <!-- FOREGROUND: High-Contrast Clear Text Content & Navigation Pills (Never obscured) -->
  <g transform="translate(60, 55)">
    <!-- Top Micro Tag Pill -->
    <g>
      <rect x="0" y="0" width="220" height="28" rx="14" fill="rgba(0, 245, 160, 0.12)" stroke="rgba(0, 245, 160, 0.4)" stroke-width="1.2"/>
      <circle cx="14" cy="14" r="4" fill="#00F5A0" />
      <text x="26" y="18" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#00F5A0" letter-spacing="1">ULTRA PERFORMANCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" class="title-text">
      Web Performance &amp;
    </text>
    <text x="0" y="128" class="title-text" fill="url(#accentGrad)">
      Frontend Optimization
    </text>

    <!-- Subtitle -->
    <text x="0" y="172" class="subtitle-text">
      Curated ecosystem of SaaS suites, edge CDNs, asset minifiers, &amp; Core Web Vitals RUM tooling.
    </text>

    <!-- Feature Attribute Pills -->
    <g transform="translate(0, 206)">
      <!-- Pill 1: Edge Caching -->
      <g>
        <rect x="0" y="0" width="130" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.14)" />
        <text x="65" y="20" text-anchor="middle" class="badge-pill-text">⚡ Edge Caching</text>
      </g>
      <!-- Pill 2: Core Web Vitals -->
      <g transform="translate(142, 0)">
        <rect x="0" y="0" width="155" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.14)" />
        <text x="77" y="20" text-anchor="middle" class="badge-pill-text">📊 Core Web Vitals</text>
      </g>
      <!-- Pill 3: Bundlers & Minifiers -->
      <g transform="translate(309, 0)">
        <rect x="0" y="0" width="170" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.14)" />
        <text x="85" y="20" text-anchor="middle" class="badge-pill-text">📦 Rust/Go Bundlers</text>
      </g>
      <!-- Pill 4: AI Craft Auditing -->
      <g transform="translate(491, 0)">
        <rect x="0" y="0" width="165" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.14)" />
        <text x="82" y="20" text-anchor="middle" class="badge-pill-text">🤖 AI Craft Auditing</text>
      </g>
    </g>
  </g>
</svg>
